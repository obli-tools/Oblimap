# conf.d/default.conf — included inside the http{} block of the stock
# nginx.conf (nginx:alpine image), so the http-context directives below
# (map, log_format) are valid at the top of this file.

# ── Access log without secrets ───────────────────────────────────────────────
# Some URLs carry a secret in their query string: probe installer downloads
# (?key=<enrolment API key>), password-reset links (?token=...) and the
# Obligate SSO callback (?code=...&state=...). For those paths the query string
# is logged as "?[redacted]"; every other request is logged unchanged. The
# Referer is scrubbed the same way (the reset page's API calls send its URL).
#
# The error log cannot be redacted: its format is fixed and error-level lines
# include the raw request line and Referer, e.g. on a 502 while the server
# restarts: request: "GET /api/probe/installer/linux?key=<API key> HTTP/1.1".
# The two proxied paths whose request line carries a secret (probe installer,
# SSO callback) therefore log only at "crit" level (nested locations below):
# their upstream failures show up in the access log only. Still possible: an
# error-level line for an API call made from the password-reset page, whose
# Referer holds the reset token (valid 1 hour, single use). To drop those too,
# add "error_log /var/log/nginx/error.log crit;" to the server block, at the
# cost of every upstream error message.
#
# Device web proxy links (/api/tunnel/p/<token>/...) carry their access token
# in the path: it is logged as "[token]", in the request and in the Referer.
map $request_uri $oblimap_log_uri {
    "~*^(?<oblimap_tun_pre>/+api/tunnel/p/)[^/?]+(?<oblimap_tun_rest>.*)$"  "${oblimap_tun_pre}[token]${oblimap_tun_rest}";
    "~*^(?<oblimap_log_path>/+(?:api/probe/installer/|reset-password|auth/callback)[^?]*)\?"  "${oblimap_log_path}?[redacted]";
    default  $request_uri;
}

map $http_referer $oblimap_log_referer {
    "~*^(?<oblimap_tref_pre>[^?]*/api/tunnel/p/)[^/?]+(?<oblimap_tref_rest>.*)$"  "${oblimap_tref_pre}[token]${oblimap_tref_rest}";
    "~*^(?<oblimap_ref_path>[^?]*/(?:api/probe/installer/|reset-password|auth/callback)[^?]*)\?"  "${oblimap_ref_path}?[redacted]";
    default  $http_referer;
}

log_format oblimap_redacted '$remote_addr - $remote_user [$time_local] '
                            '"$request_method $oblimap_log_uri $server_protocol" '
                            '$status $body_bytes_sent "$oblimap_log_referer" '
                            '"$http_user_agent" "$http_x_forwarded_for"';

# ── Dedicated tunnel origin (optional, TUNNEL_ORIGIN) ─────────────────────────
# Device pages opened through a tunnel are served under /api/tunnel/p/<token>/.
# Without TUNNEL_ORIGIN they stay on the Oblimap address, sandboxed: nothing
# to change here. With TUNNEL_ORIGIN=https://tunnel.example-devices.net (a
# separate registrable domain, never a sub-domain or sibling of Oblimap's
# host: device scripts there could otherwise set cookies that replace the
# Oblimap session), route that
# extra host name to this same container (DNS record + the edge proxy / TLS
# certificate that already fronts Oblimap): the catch-all server below serves
# it, the Oblimap server only answers the proxy routes on that host
# (everything else is 404) and never serves device pages on the main address.
# To also stop that host at nginx, add a server block such as:
#
#   server {
#       listen 80;
#       server_name tunnel.example-devices.net;
#       server_tokens off;
#       access_log /var/log/nginx/access.log oblimap_redacted;
#       client_max_body_size 10m;
#       location /api/tunnel/p/ {
#           proxy_pass http://server:3002;
#           proxy_http_version 1.1;
#           proxy_buffering off;
#           proxy_set_header Host $host;
#           proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
#           proxy_set_header X-Real-IP $remote_addr;
#           proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
#           error_log /var/log/nginx/error.log crit;
#       }
#       location / { return 404; }
#   }

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # No nginx version in the Server header and error pages.
    server_tokens off;

    access_log /var/log/nginx/access.log oblimap_redacted;

    # Upper bound for request bodies (nginx default: 1 MB). Express still
    # applies its own, tighter limits per route.
    client_max_body_size 10m;

    # Forwarding headers (same as Obliance), repeated in every proxied location
    # because proxy_set_header is not inherited once a location sets its own:
    # - X-Forwarded-For $proxy_add_x_forwarded_for APPENDS the address nginx
    #   sees, so the right-most entry — the one Express resolves req.ip from,
    #   i.e. the rate-limit key — can no longer be written by the client.
    # - X-Real-IP overwrites any client-supplied value with the peer nginx sees
    #   (the edge proxy when there is one).
    # - X-Forwarded-Proto is passed through from the edge TLS proxy (Nginx Proxy
    #   Manager, Traefik, Caddy...), which must set or overwrite it; it is empty
    #   when the client container is reached directly over plain HTTP.

    # Obligate SSO callback / redirect (browser-facing, before SPA fallback)
    # ^~ on the proxied prefixes below: nginx otherwise lets the static-file
    # regex location (~* .(js|css|...)$) win, so /api/tunnel/p/<token>/app.js
    # (device web UI through a tunnel) or /downloads/x.svg were looked up on
    # disk (404) instead of being proxied.
    location ^~ /auth/ {
        proxy_pass http://server:3002;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_set_header X-Forwarded-Host $host;

        # Request line carries the OAuth code and state: no error-level lines
        # (see the error log note at the top). The proxy_set_header list is
        # inherited from /auth/; proxy_pass is not, hence repeated.
        location /auth/callback {
            proxy_pass http://server:3002;
            error_log /var/log/nginx/error.log crit;
        }
    }

    # API proxy
    location ^~ /api/ {
        proxy_pass http://server:3002;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_cache_bypass $http_upgrade;

        # Request line carries the probe enrolment API key (?key=): no
        # error-level lines (see the error log note at the top). The
        # proxy_set_header list is inherited from /api/; proxy_pass is not,
        # hence repeated.
        location /api/probe/installer/ {
            proxy_pass http://server:3002;
            error_log /var/log/nginx/error.log crit;
        }

        # Device web proxy through the probes: the path carries the link's
        # token (no error-level lines, as above). Answers are streamed (the
        # server applies flow control with the probe end to end).
        location /api/tunnel/p/ {
            proxy_pass http://server:3002;
            proxy_buffering off;
            proxy_read_timeout 120s;
            error_log /var/log/nginx/error.log crit;
        }
    }

    # Socket.io proxy
    location ^~ /socket.io/ {
        proxy_pass http://server:3002;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_cache_bypass $http_upgrade;
    }

    # Health check endpoint proxy
    location /health {
        proxy_pass http://server:3002;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Desktop app downloads — proxied to Express which serves from desktop-app/dist/
    # Must be listed before the SPA fallback or Nginx would serve index.html instead.
    location ^~ /downloads/ {
        proxy_pass http://server:3002;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        # Allow large binary downloads without buffering issues
        proxy_buffering off;
        proxy_read_timeout 300s;
    }

    # Security headers for what nginx serves itself (SPA document + static
    # files); proxied locations get theirs from helmet in Express. add_header is
    # not inherited by a location that has its own add_header, hence repeated.
    # No X-Frame-Options / CSP frame-ancestors here: the ObliTools desktop
    # shell embeds the app in a cross-site iframe.

    # Dedicated tunnel host (TUNNEL_ORIGIN): a device page that navigates to a
    # root-relative URL (location.href = "/home.html", a form, a URL built by
    # a script) leaves the /api/tunnel/p/<token>/ prefix. The Oblimap server
    # maps such a request to the tunnel named by the obl_tunnel binding cookie
    # (tunnelOriginGuard), so it must reach the server instead of the SPA. That
    # cookie is host-only and set by the proxy on the tunnel host alone: the
    # Oblimap address never carries it and keeps being served below.
    location @oblimap_tunnel_root {
        proxy_pass http://server:3002;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_buffering off;
        proxy_read_timeout 120s;
        error_log /var/log/nginx/error.log crit;
    }

    # SPA fallback
    location / {
        error_page 418 = @oblimap_tunnel_root;
        if ($cookie_obl_tunnel) { return 418; }
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        # The SPA document is always revalidated: a cached copy would outlive a
        # release (and, on the tunnel host, keep answering device paths).
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/ /index.html;
    }

    # Cache static assets
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2)$ {
        error_page 418 = @oblimap_tunnel_root;
        if ($cookie_obl_tunnel) { return 418; }
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }
}
